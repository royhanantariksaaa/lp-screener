name: Collect X profile feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: workers/x-feed-collector
    steps:
      - name: Check out screener
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect and publish snapshot
        env:
          TWS_COOKIES: ${{ secrets.TWS_COOKIES }}
          TWS_ACCOUNT: collector
          TWS_HTTP_BACKEND: curl
          X_HANDLES_PER_RUN: "20"
          X_POSTS_PER_HANDLE: "30"
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: python collector.py
